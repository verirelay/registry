services:
  verirelay-registry:
    image: ghcr.io/verirelay/registry:v0.1.0
    environment:
      HTTP_ADDR: ":8080"
      DB_HOST: postgres
      DB_NAME: "${DB_NAME:-verirelay}"
      DB_PORT: "${DB_PORT:-5432}"
      DB_PWD: "${DB_PWD:-local-development-only}"
      DB_USER: "${DB_USER:-verirelay}"
      DB_SSLMODE: disable
      DB_MAX_CONNS: "${DB_MAX_CONNS:-32}"
      API_PWD_HASH: "${API_PWD_HASH:?API_PWD_HASH must be set to a bcrypt hash}"
      RELEASE_PUBLIC_KEY: "${RELEASE_PUBLIC_KEY:?RELEASE_PUBLIC_KEY must be set to the Release Key public key}"
    ports:
      - "${HTTP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    command: ["postgres", "-p", "${DB_PORT:-5432}"]
    environment:
      POSTGRES_DB: "${DB_NAME:-verirelay}"
      POSTGRES_USER: "${DB_USER:-verirelay}"
      POSTGRES_PASSWORD: "${DB_PWD:-local-development-only}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB -p ${DB_PORT:-5432}"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 5s
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres-data:
