name: release

# Publishes the container image to GHCR.
#
# Tags:
#   sha-<full commit>  immutable identity, pushed by every build
#   <version>          the release tag
#   latest             moves only on a release
#
# The digest (ghcr.io/...@sha256:...) identifies a deployment; tags are only an
# index. The image is signed with cosign keyless.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag used as the release tag and the image version tag, for example v0.1.0
        required: true
      promote_latest:
        description: Whether to point latest at this build
        type: boolean
        default: false

permissions:
  contents: write           # create the release
  packages: write           # push to GHCR
  id-token: write           # cosign keyless and artifact attestation
  attestations: write       # GitHub artifact attestation
  artifact-metadata: write  # storage record of the attested image

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
      PROMOTE_LATEST: ${{ github.event_name == 'push' || inputs.promote_latest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}

      - name: resolve source identity
        id: source
        run: |
          set -euo pipefail
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "error: release must build from a clean working tree" >&2
            exit 1
          fi
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # A pinned builder keeps the index digest stable for the same commit.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        with:
          driver-opts: image=moby/buildkit:v0.34.1@sha256:99368f3e46177c6405b9740e4461d91cee004128daeecca78d4ceac50ec1da5c

      - name: login to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: resolve image tags
        id: meta
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          tags="${image}:sha-${{ steps.source.outputs.commit }}"
          if [[ "$PROMOTE_LATEST" == "true" ]]; then
            tags="${tags}"$'\n'"${image}:${RELEASE_TAG}"$'\n'"${image}:latest"
          fi
          {
            echo "image=$image"
            echo "tags<<EOF"
            printf '%s\n' "$tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: guard against re-pointing an existing sha tag
        run: |
          set -euo pipefail
          ref="${{ steps.meta.outputs.image }}:sha-${{ steps.source.outputs.commit }}"
          if existing="$(docker buildx imagetools inspect "$ref" --format '{{.Manifest.Digest}}' 2>/dev/null)"; then
            echo "error: ${ref} already exists (digest ${existing}); the image for a commit is never overwritten" >&2
            exit 1
          fi

      # BuildKit provenance/sbom would change the index digest on every build;
      # provenance is attached as OCI referrers below instead.
      - name: build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          provenance: false
          sbom: false

      - name: install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.1.4'

      - name: sign image (keyless)
        run: cosign sign --yes "${{ steps.meta.outputs.image }}@${{ steps.build.outputs.digest }}"

      - name: attest image provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-name: ${{ steps.meta.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: verify signature (self-check)
        run: |
          set -euo pipefail
          cosign verify "${{ steps.meta.outputs.image }}@${{ steps.build.outputs.digest }}" \
            --certificate-identity-regexp '^https://github\.com/'"${GITHUB_REPOSITORY}"'/\.github/workflows/release\.yml@' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com

      - name: publish release
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_REF: ${{ steps.meta.outputs.image }}@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/RELEASE_NOTES.md"
          {
            echo 'The container image is published to GHCR:'
            echo
            echo '```'
            echo "docker pull ${IMAGE_REF}"
            echo '```'
            echo
            echo 'Verify its signature:'
            echo
            echo '```'
            echo "cosign verify ${IMAGE_REF} \\"
            echo "  --certificate-identity-regexp '^https://github\\.com/${GITHUB_REPOSITORY}/\\.github/workflows/release\\.yml@' \\"
            echo '  --certificate-oidc-issuer https://token.actions.githubusercontent.com'
            echo '```'
          } > "$notes"
          gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --notes-file "$notes"
