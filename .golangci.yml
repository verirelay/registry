version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - bodyclose
    - errcheck
    - errorlint
    - gocyclo
    - gosec
    - govet
    - ineffassign
    - misspell
    - noctx
    - staticcheck
    - unused
  settings:
    gocyclo:
      min-complexity: 20
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gocyclo
          - gosec

formatters:
  enable:
    - gofmt
    - gofumpt
